[project]
name = "webhook-service"
version = "0.1.0"
description = "Distributed webhook delivery service with idempotency, retries, DLQ, fairness, and circuit breakers."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "redis>=5.0",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "locust>=2.27",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"