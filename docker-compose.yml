services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: webhooks
    ports: ["5432:5432"]
    volumes:
      - ./src/db/data:/var/lib/postgresql/data


  redis:
    image: redis:7
    ports: ["6379:6379"]


#  migrate:
#    build: .
#    command: >
#      python -c "
#      from src.db.session import engine;
#      from src.db.models import Base;
#      Base.metadata.create_all(bind=engine);
#      print('tables created')
#      "
#    environment:
#      - DATABASE_URL=postgresql://postgres:dev@postgres:5432/webhooks
#    depends_on: [postgres]


  api:
    environment:
      - DATABASE_URL=postgresql://postgres:dev@postgres:5432/webhooks
    build: .
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8001
    ports: ["8001:8001"]
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
#      migrate:
#        condition: service_completed_successfully


  worker:
    environment:
      - DATABASE_URL=postgresql://postgres:dev@postgres:5432/webhooks
    build: .
    command: python -m src.worker.main
    depends_on: [postgres, redis]


  mock_receiver:
    build: ./mock_receiver
    ports: ["9000:9000"]